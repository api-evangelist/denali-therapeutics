name: Denali Therapeutics
description: 'Denali Therapeutics is a South San Francisco-based biopharmaceutical
  company that discovers, develops, and delivers therapeutics for people living with
  serious neurodegenerative and lysosomal storage diseases. Its proprietary Transport
  Vehicle (TV) platform is engineered to cross the blood-brain barrier so that large-molecule
  therapies can reach the brain and body. Denali maintains a public GitHub organization
  publishing open-source computational-biology and cheminformatics research tools
  (archs4, basechem, napari-mito-hcs), but publishes no public developer API. It was
  added to the API Evangelist network as a life-sciences portfolio company of GV.'
